project_id = "pagecrafts"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
# Must match NEXT_PUBLIC_APP_URL. Email links and OAuth redirects are built from
# that origin; a mismatch here (localhost vs 127.0.0.1) is why confirmation
# links used to bounce.
site_url = "http://localhost:3000"
# Exact allow-list. GoTrue will not follow a redirect that is not on this list
# — it silently falls back to site_url, and /api/v1/auth/confirm never runs.
# Keep in lockstep with `localAuthRedirectAllowList()` in src/lib/auth/email-urls.ts.
additional_redirect_urls = [
  "http://localhost:3000/api/v1/auth/confirm",
  "http://localhost:3000/api/v1/auth/confirm?next=/new",
  "http://localhost:3000/api/v1/auth/confirm?next=/reset",
  "http://localhost:3000/api/v1/auth/callback",
  "http://localhost:3000/api/v1/auth/callback**",
  "http://127.0.0.1:3000/api/v1/auth/confirm",
  "http://127.0.0.1:3000/api/v1/auth/confirm?next=/new",
  "http://127.0.0.1:3000/api/v1/auth/confirm?next=/reset",
  "http://127.0.0.1:3000/api/v1/auth/callback",
  "http://127.0.0.1:3000/api/v1/auth/callback**",
]
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
enable_confirmations = false
otp_expiry = 900

# Custom SMTP. Off locally so mail lands in Inbucket (http://127.0.0.1:54324).
# Hosted projects must enable this — Authentication → Emails → SMTP — pointed
# at Resend, SendGrid, or Amazon SES. `npm run auth:email` prints the values
# from SMTP_PROVIDER / SMTP_PASS / SMTP_ADMIN_EMAIL and, with a linked
# project, pushes them. Uncomment the block only when those env vars are set;
# `env(SMTP_PASS)` with the variable missing will refuse to start the stack.
#
# [auth.email.smtp]
# enabled = true
# host = "env(SMTP_HOST)"
# port = 587
# user = "env(SMTP_USER)"
# pass = "env(SMTP_PASS)"
# admin_email = "env(SMTP_ADMIN_EMAIL)"
# sender_name = "Pagecrafts"
