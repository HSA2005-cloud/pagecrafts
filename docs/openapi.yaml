openapi: 3.1.0
info:
  title: Pagecrafts API
  version: 1.0.0
  description: Frozen Day 1 API contract.
servers:
  - url: /api/v1
paths:
  /generate:
    post:
      operationId: generateSite
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateSiteRequest'
      responses:
        '202':
          description: Generation accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateSiteResult'
        default:
          $ref: '#/components/responses/Error'
  # The design library (R2). Public, read-only: choosing a design happens before anyone has
  # an account, so a door here would be a door in the middle of the funnel.
  /templates:
    get:
      operationId: listTemplates
      parameters:
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/Category'
        - name: colour
          in: query
          schema:
            type: string
            enum: [light, dark]
        - name: layout
          in: query
          schema:
            type: string
            enum: [split, full-bleed, centered, showcase]
        - name: feature
          in: query
          schema:
            type: string
            enum: [form, list, photo]
        - name: tier
          in: query
          schema:
            $ref: '#/components/schemas/TemplateTier'
        - name: q
          in: query
          description: Free text over a design's name, description and tags.
          schema:
            type: string
            maxLength: 100
        - name: sort
          in: query
          schema:
            type: string
            enum: [recommended, free-first, premium-first, name]
        - name: intent
          in: query
          description: >-
            The classifier's category for a described site. Orders the gallery by the
            deterministic score; unlike `category` it never filters (D5).
          schema:
            $ref: '#/components/schemas/Category'
        - name: tone
          in: query
          schema:
            type: string
            enum: [playful, formal, minimal, bold, warm]
        - name: palette
          in: query
          schema:
            type: string
            enum: [light, dark, colourful, muted]
      responses:
        '200':
          description: >-
            Matching designs, ordered. An unrecognised filter value is ignored rather than
            refused, so a stale link answers with a broader gallery (D-4, FR-035).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateListResult'
        default:
          $ref: '#/components/responses/Error'
  /templates/{templateId}:
    parameters:
      - name: templateId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getTemplate
      responses:
        '200':
          description: One design, for the detail modal (screen 05).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateDetailResult'
        default:
          $ref: '#/components/responses/Error'
  /projects:
    get:
      operationId: listProjects
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The owner's projects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResult'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createProject
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProjectResult'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProject
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Project detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetailResult'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: patchProject
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchProjectRequest'
      responses:
        '200':
          description: Updated project detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetailResult'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteProject
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteProjectRequest'
      responses:
        '200':
          description: Project removed (our row only), after the same password check as sign-in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResult'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/files:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProjectFiles
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Project working tree.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectFilesResult'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: putProjectFiles
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  $ref: '#/components/schemas/FileMap'
                expectedUpdatedAt:
                  type: string
                  format: date-time
                  description: >-
                    The `updatedAt` this tree was read at. When present the write is refused
                    with `conflict` if the project has changed since, so two editors open on
                    one project cannot silently delete each other's work (R3 D6). Omit it to
                    replace the tree unconditionally.
      responses:
        '200':
          description: Updated project working tree.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectFilesResult'
        '409':
          description: >-
            `expectedUpdatedAt` no longer matches: someone saved between this caller's read
            and its write. Nothing was written. Re-read the tree and merge before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResult'
        default:
          $ref: '#/components/responses/Error'
  # Per-path file access. Shipped R3 D3; documented here at D4 so the contract tests have
  # a spec to hold the routes to. `path` is a catch-all: "sections/hero.html" arrives as
  # nested segments and is rejoined by the handler.
  /projects/{projectId}/files/{path}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/FilePath'
    get:
      operationId: getProjectFile
      security:
        - sessionCookie: []
      responses:
        '200':
          description: One file's contents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectFileResult'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: putProjectFile
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
      responses:
        '200':
          description: File written. Marks the tree dirty; never commits (V-4).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileWriteResult'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteProjectFile
      security:
        - sessionCookie: []
      responses:
        '200':
          description: File removed from the working tree.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileWriteResult'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/content:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    patch:
      operationId: patchProjectContent
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchContentRequest'
      responses:
        '200':
          description: Content ops applied to content_json (E-1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatchContentResult'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/assets:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: createProjectAsset
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUnsplashAssetRequest'
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                kind:
                  $ref: '#/components/schemas/AssetKind'
      responses:
        '201':
          description: Asset stored, with attribution for an Unsplash pick (S-1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetResult'
        default:
          $ref: '#/components/responses/Error'
  # The commit mirror (R3 D4). Read-only here: the explicit save (POST) and restore write
  # a real commit first and mirror it afterwards, and land with the workspace Git work.
  /images/search:
    get:
      operationId: searchImages
      description: >-
        The photo library the content panel's image slots open (S-1). Search only —
        it registers no download and creates no asset; choosing a result is
        POST /projects/{projectId}/assets. The Unsplash access key stays server-side.
      security:
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 80
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
      responses:
        '200':
          description: Matching photos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageSearchResult'
  # The publish history behind screen 02 (R3 D13). Attempts, not successes: a failed
  # publish is the row somebody debugging needs most.
  /projects/{projectId}/deployments:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listProjectDeployments
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Publish attempts, newest first, success and failure alike (V-7).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentListResult'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/commits:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listProjectCommits
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Version history, newest first, read from the mirror (E-6).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitListResult'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createProjectCommit
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommitRequest'
      responses:
        '201':
          description: Save point created. An unchanged tree returns the existing sha.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCommitResult'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/restore:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: restoreProject
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreRequest'
      responses:
        '200':
          description: >-
            Working tree returned to the chosen version. Additive — older history is
            untouched (FR-075, BR-15).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreResult'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/generate:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: generateProject
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        '202':
          description: Generation accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateJobResult'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/edits:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: proposeScopedEdit
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposeEditRequest'
      responses:
        '200':
          description: Proposed section patch. Writes nothing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposeEditResult'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/edits/apply:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: applyScopedEdit
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyEditRequest'
      responses:
        '201':
          description: Applied to exactly one section and wrote composition.json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyEditResult'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/composition:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getComposition
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Stored composition, migrated to the current schema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompositionResult'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: patchComposition
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchCompositionRequest'
      responses:
        '200':
          description: Deterministic structure ops. Zero provider calls.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompositionResult'
        default:
          $ref: '#/components/responses/Error'
  /jobs/{jobId}:
    get:
      operationId: getGenerationJob
      security:
        - sessionCookie: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResult'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/edit:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: proposeProjectEdit
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditProjectRequest'
      responses:
        '200':
          description: Proposed single-file edit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditProjectResult'
        default:
          $ref: '#/components/responses/Error'
  /projects/{projectId}/publish:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
    post:
      operationId: publishProject
      security:
        - sessionCookie: []
      responses:
        '202':
          description: Publish accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishProjectResult'
        default:
          $ref: '#/components/responses/Error'
  /deployments/{deploymentId}:
    parameters:
      - name: deploymentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getDeployment
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Publish state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentResult'
        default:
          $ref: '#/components/responses/Error'
  /account:
    get:
      operationId: getAccount
      security:
        - sessionCookie: []
      responses:
        '200':
          description: >-
            The caller's own account. Scoped by RLS rather than by an id in the request —
            there is no path that names a user, so there is none to guess.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResult'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteAccount
      security:
        - sessionCookie: []
      responses:
        '200':
          description: >-
            Account, sites, files, version history and publish records removed. Already
            published sites stay online — they belong to the person, and closing an account
            is not a request to take a website down (C-12).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAccountResult'
        default:
          $ref: '#/components/responses/Error'
  /account/consent:
    patch:
      operationId: setTrainingConsent
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRequest'
      responses:
        '200':
          description: >-
            Consent recorded. Off by default and never inferred: the field is required, so
            an absent value is a validation_failed rather than a guess ([R2] §11 R11).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResult'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sb-access-token
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FilePath:
      name: path
      in: path
      required: true
      description: >-
        Project-relative text path, e.g. "index.html" or "sections/hero.html".
        Absolute paths and traversal are rejected with validation_failed (C-02).
      schema:
        type: string
        minLength: 1
  responses:
    Error:
      description: API failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
  schemas:
    Category:
      type: string
      # The frozen ten, plus the finer buckets each library batch added so a design reads
      # with the right label and the classifier can route intent to it. Kept in step with
      # CATEGORIES in lib/ai/schemas.ts, which a contract test compares this list against.
      # The frozen ten, plus the finer buckets each library batch added so each design
      # reads with the right label and the classifier can route intent to it.
      enum: [portfolio, restaurant, saas, blog, event, resume, agency, store, nonprofit, other,
             fitness, food, photography, architecture, education, travel, business,
             beauty, real_estate, healthcare, design, professional_services, entertainment,
             hospitality, automotive, media,
             sports, health_wellness, pets, arts_culture, retail, finance,
             wellness, health, creative, technology,
             professional, personal]
    TemplateTier:
      type: string
      enum: [free, premium, signature]
    TemplatePalette:
      type: object
      required: [bg, ink, muted, accent, panel]
      properties:
        bg: { type: string }
        ink: { type: string }
        muted: { type: string }
        accent: { type: string }
        panel: { type: string }
    # The miniature a tile draws, parsed from the design's own markup so a card can never
    # advertise a layout the template does not have. Static: never a live iframe (D-3).
    TemplatePreview:
      type: object
      required: [wordmark, nav, headline, subhead, cta, layout, motif, palette]
      properties:
        wordmark: { type: string }
        nav:
          type: array
          items: { type: string }
        headline: { type: string }
        subhead: { type: string }
        cta: { type: string }
        layout:
          type: string
          enum: [split, full-bleed, centered, showcase]
        motif: { type: string }
        heroImage:
          type: string
          description: Absolute https URL, or absent when the design ships no photograph.
        palette:
          $ref: '#/components/schemas/TemplatePalette'
    TemplateSummary:
      type: object
      required: [id, name, description, category, tags, tier, priceInr, thumbnailUrl, colour,
                 layout, features, preview, score]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        category:
          $ref: '#/components/schemas/Category'
        tags:
          type: array
          items: { type: string }
        tier:
          $ref: '#/components/schemas/TemplateTier'
        priceInr:
          type: integer
        thumbnailUrl:
          type: [string, 'null']
          description: Null until a thumbnail has actually been rendered — never a URL that 404s.
        colour:
          type: string
          enum: [light, dark]
        layout:
          type: string
          enum: [split, full-bleed, centered, showcase]
        features:
          type: array
          items:
            type: string
            enum: [form, list, photo]
        preview:
          $ref: '#/components/schemas/TemplatePreview'
        score:
          type: integer
          description: Deterministic relevance for this query; 0 when nothing was asked for (D-5).
    TemplateListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TemplateSummary'
        total:
          type: integer
          description: Designs in the library before filters, for the "showing N of M" line.
    ContentField:
      type: object
      required: [key, label, type]
      properties:
        key: { type: string }
        label: { type: string }
        type:
          type: string
          enum: [text, richtext, image, color, select, list]
        options:
          type: array
          items: { type: string }
        itemSchema:
          type: array
          items:
            $ref: '#/components/schemas/ContentField'
        maxLength:
          type: integer
    ContentSectionSpec:
      type: object
      required: [key, label, fields]
      properties:
        key: { type: string }
        label: { type: string }
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ContentField'
    ContentSchema:
      type: object
      required: [sections]
      properties:
        sections:
          type: array
          items:
            $ref: '#/components/schemas/ContentSectionSpec'
    # The same shape where a project may legitimately have no template to take one from.
    NullableContentSchema:
      type: [object, 'null']
      required: [sections]
      properties:
        sections:
          type: array
          items:
            $ref: '#/components/schemas/ContentSectionSpec'
    TemplateFileEntry:
      type: object
      required: [path, bytes]
      properties:
        path: { type: string }
        bytes: { type: integer }
    TemplateDetail:
      type: object
      required: [id, forkId, name, description, category, tags, thumbnailUrl, contentSchema,
                 files, preview, license, sourceUrl, tier, priceInr, editable]
      properties:
        id: { type: string }
        forkId:
          type: string
          format: uuid
          description: >-
            The `templates.id` this design occupies, derived from the slug (R3 D8). Fork
            with this: `source_template_id` is a foreign key, so `POST /projects` needs the
            uuid rather than the slug the URL carries.
        name: { type: string }
        description: { type: string }
        category:
          $ref: '#/components/schemas/Category'
        tags:
          type: array
          items: { type: string }
        thumbnailUrl: { type: string }
        contentSchema:
          $ref: '#/components/schemas/ContentSchema'
        files:
          type: array
          description: The file map as a manifest — path and size, never the file bodies.
          items:
            $ref: '#/components/schemas/TemplateFileEntry'
        preview:
          $ref: '#/components/schemas/TemplatePreview'
        license:
          type: string
          description: Non-null provenance (C-06).
        sourceUrl:
          type: string
        tier:
          $ref: '#/components/schemas/TemplateTier'
        priceInr:
          type: integer
        editable:
          type: array
          description: What the person can change, read straight off content_schema (C-07).
          items:
            type: object
            required: [key, label, fields]
            properties:
              key: { type: string }
              label: { type: string }
              fields: { type: integer }
