      type: string
      enum: [draft, pending, provisioning, pushing, enabling_hosting, verifying, live, failed]
    SiteMeta:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        # The id is the provenance record in `assets`; the URL beside it is what the
        # published <head> references, since static hosting cannot resolve an id.
        faviconAssetId:
          type: string
        faviconUrl:
          type: string
          format: uri
        ogImageAssetId:
          type: string
        ogImageUrl:
          type: string
          format: uri
    ProjectFailure:
      type: object
      description: >-
        Why the newest publish attempt did not go live, in words the owner can act on.
        Derived from the stored reason at read time, so improving the wording improves
        attempts already recorded. Absent (null) once a site is live and for a project that
        has never been published.
      required: [reason, what, next, retryable]
      properties:
        reason:
          type: string
          description: Stable key, for a client that needs to branch rather than read.
          enum:
            - provisioning_failed
            - upload_failed
            - hosting_failed
            - not_answering_yet
            - nothing_to_publish
            - not_paid_for
            - unknown
        what:
          type: string
          description: What happened. One sentence, no code and no jargon.
        next:
          type: string
          description: What happens next, or what the owner can do about it.
        retryable:
          type: boolean
          description: Whether offering "publish again" is sensible for this reason.
    ProjectSummary:
      type: object
      required: [id, name, status, liveUrl, thumbnailUrl, updatedAt, failure]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          $ref: '#/components/schemas/ProjectStatus'
        liveUrl:
          type: [string, 'null']
          format: uri
        thumbnailUrl:
          type: [string, 'null']
        updatedAt:
          type: string
          format: date-time
        failure:
          description: >-
            V-7 — a failed publish has to be legible from the dashboard without opening the
            project, and "it failed" with no reason sends the owner into the project anyway.
          oneOf:
            - $ref: '#/components/schemas/ProjectFailure'
            - type: 'null'
    ProjectDetail:
      allOf:
        - $ref: '#/components/schemas/ProjectSummary'
        - type: object
          required: [sourceTemplateId, contentJson, contentSchema, siteMeta, formEndpoint]
          properties:
            sourceTemplateId:
              type: [string, 'null']
              format: uuid
            contentJson:
              type: object
              additionalProperties: true
            contentSchema:
              # The project's own copy, taken at fork (R3 D7). The content panel is
              # generated from this and nothing else (C-07), so it travels with the project
              # rather than being fetched from a template that may since have been retired.
              # A generated project with no template gets an empty schema ({ sections: [] }),
              # never null — see rowToDetail in src/lib/data/projects.ts.
              $ref: '#/components/schemas/ContentSchema'
            siteMeta:
              $ref: '#/components/schemas/SiteMeta'
            formEndpoint:
              type: [string, 'null']
              format: uri
    Deployment:
      type: object
      required: [id, projectId, state, liveUrl, commitSha, error, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        state:
          type: string
          enum: [pending, provisioning, pushing, enabling_hosting, verifying, live, failed]
        liveUrl:
          type: [string, 'null']
          format: uri
          description: >-
            Only ever set for an attempt that reached `live` (C-05) — never a URL that has
            not been confirmed to respond.
        commitSha: { type: [string, 'null'] }
        error: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
